<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Booking</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<section class="booking-section">

    <div class="booking-container">

        <h1>Book Your Dream Vacation</h1>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Your Email"
                required
            >

            <select name="destination">

                {% for destination in destinations %}
                    <option>{{ destination.name }}</option>
                {% endfor %}

            </select>

            <button type="submit">
                Confirm Booking
            </button>

        </form>

        {% if success_message %}
            <div class="success-box">
                {{ success_message }}
            </div>
        {% endif %}

    </div>

</section>

</body>
</html>
